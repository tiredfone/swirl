[package]
name = "swirl-client"
version = "1.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
swirl-net = { path = "../swirl-net" }
wasm-bindgen = "=0.2.100"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.77"
features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
    "WebGlVertexArrayObject", "WebGlUniformLocation", "WebSocket", "MessageEvent", "MouseEvent", "WheelEvent", "Event", "CloseEvent", "KeyboardEvent", "ImageBitmap", "WebGlTexture",
]
