[package]
name = "swirl-client"
version = "1.26.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
swirl-net = { path = "../swirl-net" }
wasm-bindgen = "=0.2.121"
serde_json = "1"
swirl-core = { path = "../swirl-core" }
swirl-lua = { path = "../swirl-lua" }
swirl-physics = { path = "../swirl-physics" }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.77"
features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
    "WebGlVertexArrayObject", "WebGlUniformLocation", "WebSocket", "MessageEvent", "MouseEvent", "WheelEvent", "Event", "CloseEvent", "KeyboardEvent", "ImageBitmap", "WebGlTexture", "WebGlFramebuffer", "WebGlSampler", "ImageData", "OffscreenCanvas", "HtmlImageElement", "OffscreenCanvasRenderingContext2d", "TextMetrics", "HtmlElement", "CanvasRenderingContext2d", "Response", "Headers", "Request", "RequestInit", "HtmlInputElement", "HtmlTextAreaElement", "CssStyleDeclaration", "DomTokenList", "PointerEvent", "Node", "DomRect", "HtmlDivElement", "HtmlSpanElement", "DomStringMap", "EventTarget", "Document", "Window", "HtmlHeadElement", "Storage",
]
