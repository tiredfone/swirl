[package]
name = "swirl-server"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "swirl-server"
path = "src/main.rs"

[dependencies]
swirl-core = { path = "../swirl-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
