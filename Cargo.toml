[workspace]
resolver = "2"
members = [
    "crates/swirl-core",
    "crates/swirl-render",
    "crates/swirl-vanilla",
    "crates/swirl-physics",
    "crates/swirl-lua",
    "crates/swirl-server",
    "crates/swirl-client",
    "crates/swirl-net",
    "crates/swirl-bootstrapper",
]

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.client]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
debug = false
panic = "abort"

[profile.client-size]
inherits = "client"
opt-level = "s"
lto = "thin"
codegen-units = 1
incremental = false
